{% extends "base.html" %}
{% block body %}
<div style="max-width:520px;margin:{% if user %}24px 0{% else %}9vh auto 0{% endif %}">

    <p class="muted" style="margin:8px 0 18px">{{ message }}</p>

  </div>
</div>
{% endblock %}
