{% extends "base.html" %}
{% block title %}Sign in · {{ app_name }}{% endblock %}
{% block body %}
<div style="max-width:380px;margin:40px auto">
  <h1>Sign in</h1>
  <p class="lead">Access is by invitation.</p>
  {% if error %}<div class="alert bad">{{ error }}</div>{% endif %}
  <form class="card" method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required value="{{ email or '' }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div style="margin-top:18px"><button class="btn">Sign in</button></div>
  </form>
  <p class="note" style="margin-top:14px">Forgotten your password? Ask your administrator for a reset link.</p>
</div>
{% endblock %}
