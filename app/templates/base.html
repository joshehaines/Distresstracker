<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--ink:#1b1c1e;--muted:#6a6c70;--line:#e3e1dc;
  --accent:#1f5f4a;--accent-ink:#fff;--warn:#9a5b00;--warn-bg:#fdf3e2;--bad:#a2302a;--bad-bg:#fbeceb;--ok-bg:#e9f3ee;
  --radius:10px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141516;--panel:#1d1f21;--ink:#ecebe8;--muted:#9a9c9f;--line:#2e3033;
  --accent:#4fae8c;--accent-ink:#0d1a15;--warn:#e0a54d;--warn-bg:#2b2416;--bad:#ef7d75;--bad-bg:#2e1a19;--ok-bg:#16261f;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header .brand{font-weight:650;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
header nav{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:14px}
header nav a{color:var(--muted);text-decoration:none}
header nav a:hover{color:var(--ink)}
main{max-width:880px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.015em}
h2{font-size:16px;margin:28px 0 10px}
p.lead{color:var(--muted);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input[type=email],input[type=password],input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=file]{font:inherit;font-size:14px;max-width:100%}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:5px 10px;font-size:13px;font-weight:500}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font:inherit;cursor:pointer}
.linkbtn:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--muted)}
.alert{padding:10px 14px;border-radius:8px;margin:0 0 16px;font-size:14px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.ok{background:var(--ok-bg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td a{color:var(--ink)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.done{background:var(--ok-bg);border-color:transparent;color:var(--accent)}
.tag.failed{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
code{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 5px;word-break:break-all}
.scroll{overflow-x:auto}
@media (max-width:560px){th.hide,td.hide{display:none}}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">{{ app_name }}</a>
  {% if user %}
  <nav>
    <a href="/">Runs</a>
    {% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
    <form method="post" action="/logout" style="margin:0"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="linkbtn">Sign out</button></form>
  </nav>
  {% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
