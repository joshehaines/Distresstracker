<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef1f4; --sheet:#fff; --ink:#17212b; --muted:#5a6571; --rule:#d6dce2; --rule-strong:#b9c2cb;
  --seal:#8a1c2b; --seal-tint:#f6e9eb; --ok:#2e6a4e; --ok-tint:#e6f1eb; --warn:#94600a; --warn-tint:#fbf1de;
  --focus:#2563eb;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#11161b; --sheet:#182028; --ink:#e7ebef; --muted:#97a2ad; --rule:#2a343e; --rule-strong:#3a4652;
  --seal:#e0707d; --seal-tint:#2c1a1e; --ok:#73c39c; --ok-tint:#16271f; --warn:#e3ad55; --warn-tint:#2b2214;
  --focus:#7aa7ff;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}

/* frame */
.top{display:flex;align-items:center;gap:20px;max-width:1080px;margin:0 auto;padding:18px 24px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:-.01em}
.mark i{width:12px;height:12px;border-radius:50%;background:var(--seal);box-shadow:0 0 0 4px var(--seal-tint)}
.top nav{margin-left:auto;display:flex;gap:4px;align-items:center}
.top nav a,.top nav button{font:inherit;font-size:14px;color:var(--muted);text-decoration:none;background:none;border:0;padding:6px 10px;border-radius:6px;cursor:pointer}
.top nav a:hover,.top nav button:hover{color:var(--ink);background:var(--sheet)}
.top nav a[aria-current=page]{color:var(--ink);font-weight:600}
main{max-width:1080px;margin:0 auto;padding:8px 24px 80px}

/* type */
h1{font-size:clamp(28px,4.2vw,40px);line-height:1.1;letter-spacing:-.025em;font-weight:800;margin:24px 0 8px}
h2{font-size:18px;letter-spacing:-.01em;margin:44px 0 12px;font-weight:700}
.lede{color:var(--muted);max-width:62ch;margin:0 0 28px;font-size:17px}
.small{font-size:14px;color:var(--muted)}
.ref{font-weight:600;white-space:nowrap;letter-spacing:-.005em}

/* sheet = a white page on the slate desk */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px}
.pad{padding:24px}

/* controls */
label{display:block;font-size:14px;font-weight:600;margin:18px 0 6px}
input[type=email],input[type=password],input[type=text]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--sheet);color:var(--ink)}
input:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;padding:11px 18px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--seal);border-color:var(--seal)}
.btn:disabled{opacity:.45;cursor:not-allowed;background:var(--ink);border-color:var(--ink)}
.btn.quiet{background:transparent;color:var(--ink);border-color:var(--rule-strong)}
.btn.quiet:hover{border-color:var(--ink);background:transparent}
.btn.sm{padding:6px 11px;font-size:14px;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* notices */
.notice{border-left:3px solid var(--warn);background:var(--warn-tint);padding:12px 16px;margin:0 0 20px;font-size:15px;border-radius:0 4px 4px 0}
.notice.bad{border-color:var(--seal);background:var(--seal-tint)}
.notice.ok{border-color:var(--ok);background:var(--ok-tint)}

/* chips: status words, coloured by meaning */
.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--paper);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-tint);color:var(--ok)}
.chip.warn{background:var(--warn-tint);color:var(--warn)}
.chip.seal{background:var(--seal-tint);color:var(--seal)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--rule-strong)}
td{padding:12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
@media (max-width:640px){
  main{padding:4px 16px 64px}.top{padding:14px 16px}
  .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="mark" href="/"><i aria-hidden="true"></i>{{ app_name }}</a>
  {% if user %}
  <nav>
    <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Alerts</a>
    {% if user.is_admin %}<a href="/admin" {% if request.url.path.startswith('/admin') %}aria-current="page"{% endif %}>Team</a>{% endif %}
    <form method="post" action="/logout" style="margin:0"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button>Sign out</button></form>
  </nav>
  {% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
